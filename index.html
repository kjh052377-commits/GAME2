<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>스네이크 게임</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #141a22;
    --line: #223041;
    --green: #39ff6a;
    --green-dark: #1f9d3a;
    --red: #ff4d5e;
    --text: #e6edf3;
    --muted: #8b9aab;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #121b26 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  .app {
    height: 100vh; height: 100dvh;
    max-width: 1000px; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 10px;
  }

  /* 상단 점수 */
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .title {
    font-weight: 800; letter-spacing: 3px; color: var(--green);
    text-shadow: 0 0 12px rgba(57,255,106,.55); font-size: clamp(16px, 4vw, 24px);
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 14px; text-align: center; min-width: 76px;
  }
  .score-box small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .score-box b { font-size: clamp(18px, 5vw, 26px); font-variant-numeric: tabular-nums; }
  #score { color: var(--green); }

  /* 본문 */
  .stage { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .board-wrap {
    flex: 1 1 0; min-height: 0; min-width: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .board {
    position: relative; width: 300px; height: 300px;
    border: 2px solid var(--green-dark); border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 4px #0d141c, 0 0 28px rgba(57,255,106,.25);
    touch-action: none; background: #0a1017;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 6px;
    background: rgba(5, 8, 12, .72); padding: 12px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    margin: 0; font-size: clamp(22px, 7vw, 38px); letter-spacing: 3px; color: var(--green);
    text-shadow: 0 0 14px rgba(57,255,106,.6);
  }
  .overlay.over h2 { color: var(--red); text-shadow: 0 0 14px rgba(255,77,94,.6); }
  .overlay p { margin: 0; color: var(--muted); font-size: clamp(12px, 3.4vw, 15px); line-height: 1.5; }

  .panel { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .actions { display: flex; gap: 8px; width: 100%; max-width: 460px; }
  .btn {
    flex: 1; font: inherit; font-weight: 700; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 8px; min-height: 46px; cursor: pointer; touch-action: manipulation;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--green); }
  .btn:active:not(:disabled) { transform: scale(.96); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--green-dark); border-color: var(--green); color: #04130a; }
  .btn.primary:disabled { background: var(--panel); color: var(--text); border-color: var(--line); }

  /* 터치 방향 버튼 (터치 기기 / 작은 화면에서만 표시) */
  .dpad {
    display: none; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 8px; width: clamp(180px, 52vw, 230px); aspect-ratio: 1;
  }
  .dpad button {
    font-size: clamp(22px, 7vw, 30px); color: var(--green);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    touch-action: manipulation; cursor: pointer; padding: 0;
  }
  .dpad button:active, .dpad button.pressed {
    background: var(--green-dark); color: #04130a; border-color: var(--green);
  }
  .dpad .up { grid-area: 1 / 2; }
  .dpad .left { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down { grid-area: 3 / 2; }

  .hint { color: var(--muted); font-size: 12px; text-align: center; }

  @media (pointer: coarse), (max-width: 700px) {
    .dpad { display: grid; }
    .hint { display: none; }
  }

  /* 가로로 눕힌 스마트폰: 좌우 배치 */
  @media (orientation: landscape) and (max-height: 560px) {
    .stage { flex-direction: row; align-items: center; }
    .panel { flex: 0 0 auto; width: clamp(190px, 34vw, 280px); justify-content: center; }
    .actions { flex-wrap: wrap; }
    .actions .btn { min-height: 40px; padding: 8px 6px; }
    .dpad { width: clamp(130px, 40vh, 190px); }
    .hud { gap: 6px; }
    .score-box { padding: 2px 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="title">SNAKE</div>
    <div class="scores">
      <div class="score-box"><small>SCORE</small><b id="score">0</b></div>
      <div class="score-box"><small>BEST</small><b id="best">0</b></div>
    </div>
  </header>

  <main class="stage">
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board">
        <canvas id="canvas"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="ovTitle">SNAKE</h2>
          <p id="ovText">시작 버튼이나 방향키를 눌러 시작하세요</p>
        </div>
      </div>
    </div>

    <aside class="panel">
      <div class="actions">
        <button class="btn primary" id="startBtn">시작</button>
        <button class="btn" id="pauseBtn" disabled>일시정지</button>
        <button class="btn" id="restartBtn">다시 시작</button>
      </div>
      <div class="dpad" id="dpad" aria-label="방향 버튼">
        <button class="up" data-dir="up" aria-label="위">▲</button>
        <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
        <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
        <button class="down" data-dir="down" aria-label="아래">▼</button>
      </div>
      <div class="hint">방향키(또는 WASD) 이동 · 스페이스바 일시정지 · Enter 시작/다시 시작</div>
    </aside>
  </main>
</div>

<script>
(() => {
  'use strict';

  const COLS = 20, ROWS = 20;
  const TICK_MS = 120;          // 일정한 이동 속도 (작을수록 빠름)
  const MAX_BOARD = 600;        // PC에서 최대 게임 화면 크기(px)
  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };

  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  const board = $('board'), wrap = $('boardWrap'), overlay = $('overlay');
  const scoreEl = $('score'), bestEl = $('best');
  const startBtn = $('startBtn'), pauseBtn = $('pauseBtn'), restartBtn = $('restartBtn');

  let cell = 20;
  let snake, dir, dirQueue, food, score, best = 0;
  let state = 'ready';          // ready | running | paused | over | win
  let acc = 0, lastTime = performance.now();

  try { best = parseInt(localStorage.getItem('snake-best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- 초기화 ---------- */
  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }]; // 머리가 index 0
    dir = DIRS.right;
    dirQueue = [];
    score = 0;
    scoreEl.textContent = score;
    food = spawnFood();
    acc = 0;
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!occupied.has(x + ',' + y)) free.push({ x, y });
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  /* ---------- 상태 전환 ---------- */
  function setState(s) {
    state = s;
    updateUI();
  }

  function startGame() {
    if (state !== 'ready') return;
    acc = 0;
    setState('running');
  }

  function togglePause() {
    if (state === 'running') setState('paused');
    else if (state === 'paused') { acc = 0; setState('running'); }
  }

  function restartGame() {
    reset();
    setState('running');
  }

  function updateUI() {
    startBtn.disabled = state !== 'ready';
    pauseBtn.disabled = !(state === 'running' || state === 'paused');
    pauseBtn.textContent = state === 'paused' ? '계속하기' : '일시정지';

    overlay.classList.remove('over');
    if (state === 'running') {
      overlay.classList.add('hidden');
    } else {
      overlay.classList.remove('hidden');
      const t = $('ovTitle'), p = $('ovText');
      if (state === 'ready') {
        t.textContent = 'SNAKE';
        p.textContent = '시작 버튼이나 방향키를 눌러 시작하세요';
      } else if (state === 'paused') {
        t.textContent = 'PAUSED';
        p.textContent = '계속하기 버튼 또는 스페이스바를 누르세요';
      } else if (state === 'over') {
        overlay.classList.add('over');
        t.textContent = 'GAME OVER';
        p.innerHTML = '점수 ' + score + '점<br>다시 시작 버튼 또는 Enter 키를 누르세요';
      } else if (state === 'win') {
        t.textContent = 'CLEAR!';
        p.innerHTML = '모든 칸을 채웠습니다! 점수 ' + score + '점<br>다시 시작 버튼을 누르세요';
      }
    }
  }

  /* ---------- 방향 입력 (큐 방식: 반대 방향/연타 안전) ---------- */
  function setDirection(name) {
    const d = DIRS[name];
    if (!d) return;
    if (state === 'over' || state === 'win' || state === 'paused') return;

    // 큐의 마지막 방향(없으면 현재 방향)을 기준으로 검사
    const ref = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (d.x === -ref.x && d.y === -ref.y) return;  // 반대 방향 무시
    if (d.x === ref.x && d.y === ref.y) {
      if (state === 'ready') startGame();
      return;                                       // 같은 방향 무시
    }
    if (dirQueue.length < 3) dirQueue.push(d);
    if (state === 'ready') startGame();
  }

  /* ---------- 한 칸 이동 ---------- */
  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 벽 충돌
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();

    const eating = food && head.x === food.x && head.y === food.y;
    // 먹이를 먹지 않으면 꼬리가 빠지므로 꼬리 칸은 충돌에서 제외
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);
    if (eating) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score; bestEl.textContent = best;
        try { localStorage.setItem('snake-best', best); } catch (e) {}
      }
      food = spawnFood();
      if (!food) { setState('win'); return; }
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    setState('over');
  }

  /* ---------- 반응형 크기 조절 ---------- */
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = wrap.getBoundingClientRect();
    const size = Math.max(160, Math.floor(Math.min(rect.width, rect.height, MAX_BOARD) - 4));
    const px = Math.max(COLS, Math.floor(size * dpr / COLS)) * COLS; // 칸 크기를 정수로 맞춤
    canvas.width = px;
    canvas.height = px;
    cell = px / COLS;
    const css = px / dpr;
    board.style.width = css + 'px';
    board.style.height = css + 'px';
  }
  new ResizeObserver(resize).observe(wrap);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));

  /* ---------- 그리기 ---------- */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(t) {
    const W = canvas.width;
    ctx.fillStyle = '#0a1017';
    ctx.fillRect(0, 0, W, W);

    // 체커 패턴 + 격자선
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = '#0d151e';
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
    ctx.strokeStyle = 'rgba(80,120,160,.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      ctx.moveTo(i * cell + .5, 0); ctx.lineTo(i * cell + .5, W);
      ctx.moveTo(0, i * cell + .5); ctx.lineTo(W, i * cell + .5);
    }
    ctx.stroke();

    // 먹이
    if (food) {
      const pulse = 1 + Math.sin(t / 180) * 0.08;
      const cx = (food.x + .5) * cell, cy = (food.y + .5) * cell;
      ctx.save();
      ctx.shadowColor = 'rgba(255,77,94,.9)';
      ctx.shadowBlur = cell * .8;
      ctx.fillStyle = '#ff4d5e';
      ctx.beginPath();
      ctx.arc(cx, cy, cell * .34 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath();
      ctx.arc(cx - cell * .1, cy - cell * .12, cell * .07, 0, Math.PI * 2);
      ctx.fill();
    }

    // 뱀 (꼬리 → 머리 순서로 그려 머리가 위에 오도록)
    const pad = Math.max(1, cell * .07);
    const n = snake.length;
    ctx.save();
    ctx.shadowColor = 'rgba(57,255,106,.45)';
    ctx.shadowBlur = cell * .5;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const k = n > 1 ? i / (n - 1) : 0;           // 0(머리) ~ 1(꼬리)
      const g = Math.round(255 - k * 95);
      const r = Math.round(60 - k * 30);
      ctx.fillStyle = i === 0 ? '#7dff8f' : `rgb(${r}, ${g}, ${Math.round(90 - k * 40)})`;
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * .28);
      ctx.fill();
    }
    ctx.restore();

    // 눈
    const h = snake[0];
    const hx = (h.x + .5) * cell, hy = (h.y + .5) * cell;
    const px = -dir.y, py = dir.x;                   // 진행 방향에 수직인 벡터
    const eyeF = cell * .14, eyeS = cell * .2;
    [-1, 1].forEach(sd => {
      const ex = hx + dir.x * eyeF + px * eyeS * sd;
      const ey = hy + dir.y * eyeF + py * eyeS * sd;
      ctx.fillStyle = '#04130a';
      ctx.beginPath(); ctx.arc(ex, ey, cell * .09, 0, Math.PI * 2); ctx.fill();
    });
  }

  /* ---------- 메인 루프 ---------- */
  function loop(now) {
    const dt = Math.min(now - lastTime, 100);
    lastTime = now;
    if (state === 'running') {
      acc += dt;
      while (acc >= TICK_MS && state === 'running') {
        acc -= TICK_MS;
        step();
      }
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  /* ---------- 이벤트 ---------- */
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right'
  };

  window.addEventListener('keydown', e => {
    if (KEYMAP[e.key]) {
      e.preventDefault();                 // 화살표로 페이지가 스크롤되지 않도록
      if (!e.repeat) setDirection(KEYMAP[e.key]);
      return;
    }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (state === 'ready') startGame();
      else togglePause();
    } else if (e.key === 'Enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      if (state === 'ready') startGame();
      else if (state === 'over' || state === 'win') restartGame();
    }
  });

  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', restartGame);
  [startBtn, pauseBtn, restartBtn].forEach(b =>
    b.addEventListener('click', () => b.blur()));  // 스페이스/엔터 중복 동작 방지

  // 터치 방향 버튼: pointerdown으로 즉시 반응, 연타해도 큐로 안전하게 처리
  document.querySelectorAll('#dpad button').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      btn.classList.add('pressed');
      setDirection(btn.dataset.dir);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
      btn.addEventListener(ev, () => btn.classList.remove('pressed')));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // 게임 화면 스와이프 (보너스 조작)
  let sx = 0, sy = 0, swiping = false;
  board.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    swiping = true; sx = e.clientX; sy = e.clientY;
  });
  board.addEventListener('pointermove', e => {
    if (!swiping) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    sx = e.clientX; sy = e.clientY;
  });
  ['pointerup', 'pointercancel'].forEach(ev =>
    board.addEventListener(ev, () => { swiping = false; }));

  // 탭이 숨겨지면 자동 일시정지
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'running') setState('paused');
  });

  // 더블탭 확대, 길게 눌러 메뉴 방지
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => { if (e.target.closest('.dpad')) e.preventDefault(); });

  /* ---------- 시작 ---------- */
  reset();
  updateUI();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
